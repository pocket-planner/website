<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pocket Planner — Coming Soon</title>
  
  <!-- Primary Meta Tags -->
  <meta name="title" content="Pocket Planner — Coming Soon">
  <meta name="description" content="A minimalist companion for your daily productivity. Pocket Planner is coming soon to help you streamline your day.">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://pocket-planner-app.com/">
  <meta property="og:title" content="Pocket Planner — Coming Soon">
  <meta property="og:description" content="A minimalist companion for your daily productivity. Pocket Planner is coming soon to help you streamline your day.">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://pocket-planner-app.com/">
  <meta property="twitter:title" content="Pocket Planner — Coming Soon">
  <meta property="twitter:description" content="A minimalist companion for your daily productivity. Pocket Planner is coming soon to help you streamline your day.">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />

  <!-- Favicon / Icons -->
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />

  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Ambient Aurora Background -->
  <div class="aurora-bg">
    <div class="blob blob-1" id="blob-teal"></div>
    <div class="blob blob-2" id="blob-violet"></div>
    <div class="blob blob-3" id="blob-magenta"></div>
  </div>

  <!-- Main Content Container -->
  <main class="content-container">
    <div class="status-badge" id="badge-status">
      <span class="pulse-dot"></span>
      In Development
    </div>

    <div class="logo-wrapper" id="logo-main">
      <img src="icon.png" alt="Pocket Planner" class="app-logo" />
    </div>

    <h1 class="main-title" id="title-text">
      Pocket <span class="gradient-text">Planner</span>
    </h1>
    
    <p class="subtitle" id="subtitle-text">
      A minimalist companion for your daily productivity. Coming soon.
    </p>

    <!-- Email Subscription Form (Kit / ConvertKit) -->
    <!-- Configure by replacing 'YOUR_KIT_FORM_ID' with your actual Kit Form ID. -->
    <form action="https://app.convertkit.com/forms/9492617/subscriptions" method="post" class="subscribe-form" id="subscribe-form">
      <input type="email" name="email_address" id="bd-email" placeholder="Enter your email address" required class="email-input" />
      <button type="submit" class="submit-btn" aria-label="Subscribe">
        <span>Notify Me</span>
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="arrow-icon">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>
    </form>

    <!-- 
    Alternative Buttondown Form Integration:
    To use Buttondown instead, uncomment the block below and comment out the Kit form above.
    
    <form action="https://buttondown.email/api/emails/embed-subscribe/YOUR_BUTTONDOWN_USERNAME" method="post" target="popupwindow" onsubmit="window.open('https://buttondown.email/api/emails/embed-subscribe/YOUR_BUTTONDOWN_USERNAME', 'popupwindow')" class="subscribe-form" id="subscribe-form">
      <input type="email" name="email" id="bd-email" placeholder="Enter your email address" required class="email-input" />
      <input type="hidden" value="1" name="embed" />
      <button type="submit" class="submit-btn" aria-label="Subscribe">
        <span>Notify Me</span>
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="arrow-icon">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>
    </form>
    -->

    <footer class="footer-info" id="footer-info">
      &copy; 2026 pocket-planner-app.com. All rights reserved.
    </footer>
  </main>
</body>
</html>
